# Copy .env.production.example to .env before use.
# This file runs only the admin dashboard. Postgres, Redis, and the API stay in the backend stack.
services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: friends-cheweta-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      API_URL: ${API_URL:?Set API_URL}
      SOCKET_URL: ${SOCKET_URL:?Set SOCKET_URL}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
